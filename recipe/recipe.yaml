schema_version: 1

context:
  name: pCrunch
  version: "2.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  #url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/pCrunch-{{ version }}.tar.gz
  url: https://github.com/nrel/pCrunch/archive/v${{ version }}.tar.gz
  sha256: f8f1fcaf80adfe838ea71e1d206a240fc080f2c74a3d3a40ce6f6b036f222e45

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -v

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - fatpack
    - numexpr
    - numpy
    - pandas
    - python >=${{ python_min }}
    - pyyaml
    - ruamel.yaml
    - scipy

tests:
  - python:
      imports:
        - pCrunch
      pip_check: false
      python_version: ${{ python_min }}
  - files:
      source:
        - pCrunch
        - examples
    requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - cd examples
      - python example_casematrix.py

about:
  summary: IO and Post Processing Interface for OpenFAST Results.
  description: |
    Python utilities and scripts for ultimate load tables and fatigue damage
    equivalent life (DEL) calculation for OpenFAST aeroelastic time-series simulations
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/nrel/pcrunch
  repository: https://github.com/nrel/pcrunch

extra:
  recipe-maintainers:
    - gbarter
    - jakenunemaker
